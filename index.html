:root{--bg:#e9ebec;--card:#fff;--ink:#17191c;--mute:#5d646b;--line:#d3d7da;--c:#c8202f;--on:#fff}
body.B{--c:#1857b8}body.C{--c:#f2c200;--on:#17191c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Roboto,sans-serif;padding-bottom:110px}
header{background:var(--c);color:var(--on);padding:calc(18px + env(safe-area-inset-top)) 16px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font:400 44px/1.05 Anton,sans-serif;margin:0}
.sub{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:12px;flex-wrap:wrap}
label.date{font-size:14px;display:flex;flex-direction:column;gap:2px}
input,button{font:inherit;color:inherit}
input{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:6px;min-width:0}
input[type=date]{padding:7px 8px}
button{cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:9px 12px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{padding:12px}
.ex{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border-left:10px solid var(--c)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:start}
h2{font:400 22px/1.2 Anton,sans-serif;letter-spacing:.01em;margin:0}
.scheme{font:400 28px/1 Anton,sans-serif;white-space:nowrap}
.meta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 10px;gap:8px;color:var(--mute);font-size:14px}
.rest{font-size:14px;padding:6px 11px;border-radius:99px;white-space:nowrap}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sets label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);text-align:center}
.sets input{width:100%;text-align:center;font-size:19px;font-weight:600;padding:10px 2px}
.sets input.bad{border-color:#c8202f;background:#fdeaec}
.last{font-size:14px;margin-top:10px}
details{margin-top:8px;font-size:14px}summary{cursor:pointer;color:var(--mute);padding:4px 0}
table{width:100%;border-collapse:collapse}td{border-top:1px solid var(--line);padding:7px 4px;vertical-align:middle}
td:last-child{text-align:right}td button{padding:4px 8px;font-size:13px}
svg{width:100%;height:70px;display:block;margin:6px 0}
.note{width:100%;margin-top:8px;padding:8px;font-size:15px}
.tools{padding:8px 4px;font-size:14px;color:var(--mute)}.tools div{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
#warn{display:none;background:#fff3c4;color:#17191c;border:2px solid #17191c;border-radius:8px;padding:12px;margin-bottom:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#17191c;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:2}
nav .wrap{display:flex;gap:8px}
nav button{flex:1;background:none;border:0;color:#fff;border-radius:8px;padding:6px 2px;border-bottom:5px solid var(--k);font-size:12px}
nav b{display:block;font:400 24px/1.15 Anton,sans-serif}
nav button[aria-current=true]{background:var(--k);color:var(--t)}
#timer{position:fixed;left:12px;right:12px;bottom:90px;max-width:536px;margin:auto;background:#17191c;color:#fff;border-radius:12px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:3;box-shadow:0 6px 24px #0006}
#timer output{font:400 38px/1 Anton,sans-serif}#timer.done{background:#17803d}
#timer span{flex:1;font-size:13px}#timer button{background:#fff;color:#17191c}
</style></head><body class="A">
<header><div class="wrap"><h1 id="title"></h1>
<div class="sub"><div id="progress" aria-live="polite"></div>
<label class="date">Data allenamento<input type="date" id="date"></label></div></div></header>
<main class="wrap"><div id="warn" role="alert"></div><div id="list"></div>

<div><button id="exp">Scarica copia dei pesi</button><button id="imp">Ripristina da copia</button><input type="file" id="file" accept=".json,application/json" hidden></div></section></main>

<script>
const DAYS={
A:{name:"Petto e schiena",k:"#c8202f",t:"#fff",ex:[
["a1","Panca piana","5x6",90],["a2","Spinte inclinata 30°","4x10",90],["a3","Croci ai cavi alti","3x15",60],
["a4","Lat machine","4x8",90],["a5","Vertical row","3x10",90],["a6","Pull down","3x12",60]]},
B:{name:"Gambe",k:"#1857b8",t:"#fff",ex:[
["b1","Leg press","5x6",90],["b2","Affondi","4x10",60],["b3","Leg extension","3x15",60],
["b4","½ stacco","4x8",90],["b5","Leg curl","3x12",60],["b6","Calf","5x15/20",60,"Carico massimo"]]},
C:{name:"Spalle e braccia",k:"#f2c200",t:"#17191c",ex:[
["c1","Lento avanti","5x6",90],["c2","Alzate laterali","4x10",90],["c3","Alzate 90°","3x12",60],
["c4","Alzate al cavo basso","1x15",0],["c5","Curl bilanciere","4x8",90],["c6","Hammer curl","3x12",60],
["c7","French press","4x8",90],["c8","Push down","3x12",60]]}};
const KEY="scheda-palestra-v1",$=s=>document.querySelector(s);
let data={log:{},day:"A"},canSave=true;
const iso=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const it=d=>d.split("-").reverse().join("/");
const kg=n=>String(n).replace(".",",");
function warn(t){const w=$("#warn");w.textContent=t;w.style.display="block"}
function noSave(){canSave=false;warn("Attenzione: qui i pesi non vengono salvati. Apri il file con un altro browser, oppure scarica una copia prima di chiudere.")}
try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s);localStorage.setItem(KEY,JSON.stringify(data))}catch(e){noSave()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){noSave()}}
let date=iso(),picked=false;
const el=(tag,props={},...kids)=>{const e=Object.assign(document.createElement(tag),props);e.append(...kids);return e};
const entry=(id,d)=>data.log[id]&&data.log[id][d];
const dates=id=>Object.keys(data.log[id]||{}).sort();
const fmt=e=>{const s=e.s.map(v=>v==null?"–":kg(v));while(s.length&&s[s.length-1]==="–")s.pop();return(s.length?s.join(" / ")+" kg":"")+(e.n?(s.length?", ":"")+e.n:"")};
function progress(){const ex=DAYS[data.day].ex,n=ex.filter(x=>entry(x[0],date)).length;$("#progress").textContent="Esercizi registrati: "+n+" di "+ex.length}
function history(box,id){
 const all=dates(id),prev=all.filter(d=>d<date).pop();
 box.replaceChildren();
 box.append(el("div",{className:"last",textContent:prev?"Ultima volta ("+it(prev)+"): "+fmt(entry(id,prev)):"Nessun peso registrato prima di questa data."}));
 if(!all.length)return;
 const det=el("details",{open:box.dataset.open==="1"},el("summary",{textContent:"Storico e andamento ("+all.length+")"}));
 det.ontoggle=()=>box.dataset.open=det.open?"1":"";
 const pts=all.map(d=>[d,Math.max(...entry(id,d).s.filter(v=>v!=null))]).filter(p=>isFinite(p[1]));
 if(pts.length>1){const v=pts.map(p=>p[1]),lo=Math.min(...v),hi=Math.max(...v);
  const xy=v.map((y,i)=>(6+i*288/(v.length-1))+","+(hi===lo?35:62-(y-lo)/(hi-lo)*54));
  det.insertAdjacentHTML("beforeend",`<div>Peso massimo: da ${kg(v[0])} a ${kg(v[v.length-1])} kg</div><svg viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"><polyline points="${xy.join(" ")}" fill="none" stroke="#17191c" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`)}
 const t=el("table");
 all.slice().reverse().forEach(d=>{const b=el("button",{textContent:"Elimina",onclick:()=>{if(confirm("Eliminare i pesi del "+it(d)+"?")){delete data.log[id][d];save();render()}}});
  t.append(el("tr",{},el("td",{textContent:it(d)}),el("td",{textContent:fmt(entry(id,d))}),el("td",{},b)))});
 det.append(t);box.append(det)}
function card([id,name,scheme,rest,extra]){
 const n=parseInt(scheme),cur=entry(id,date),prevD=dates(id).filter(d=>d<date).pop(),prev=prevD&&entry(id,prevD);
 const grid=el("div",{className:"sets"}),hist=el("div"),inputs=[];
 const note=el("input",{className:"note",placeholder:"Nota (facoltativa)",value:cur&&cur.n||"",maxLength:80});
 note.setAttribute("aria-label","Nota per "+name);
 const update=()=>{
  const old=entry(id,date);
  const s=inputs.map((i,k)=>{const t=i.value.trim().replace(",","."),ok=/^(\d{1,4}(\.\d*)?)?$/.test(t);i.classList.toggle("bad",!ok);
   return !ok?(old?old.s[k]??null:null):t===""?null:parseFloat(t)});
  data.log[id]=data.log[id]||{};
  if(s.some(v=>v!=null)||note.value.trim())data.log[id][date]={s,n:note.value.trim()};else delete data.log[id][date];
  save();history(hist,id);progress()};
 for(let k=0;k<n;k++){const i=el("input",{inputMode:"decimal",autocomplete:"off",value:cur&&cur.s[k]!=null?kg(cur.s[k]):"",placeholder:prev&&prev.s[k]!=null?kg(prev.s[k]):"kg",oninput:update});
  i.setAttribute("aria-label",name+", serie "+(k+1)+", chili");inputs.push(i);grid.append(el("label",{},(k+1)+"ª",i))}
 note.oninput=update;history(hist,id);
 const meta=el("div",{className:"meta"},el("span",{textContent:extra||"Carico variabile"}),
  rest?el("button",{className:"rest",textContent:"Recupero "+clock(rest),onclick:()=>start(rest,name)}):el("span",{textContent:"Senza recupero"}));

const clock=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
